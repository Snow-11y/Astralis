<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="44%" r="52%">
      <stop offset="0%"   stop-color="#1A063A"/>
      <stop offset="100%" stop-color="#04010C"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E8CCFF" stop-opacity="1"/>
      <stop offset="38%"  stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4B0082" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="midGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#9333EA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1A063A"  stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#F5EAFF"/>
      <stop offset="40%"  stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%"   stop-color="#EDE9FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D8B4FE"/>
      <stop offset="50%"  stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"  result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinybloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordglow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ░░ BACKGROUND ░░ -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Ambient field glow -->
  <ellipse cx="250" cy="225" rx="200" ry="185" fill="url(#midGlow)"/>

  <!-- ░░ DEEP BACKGROUND STARS — dust layer ░░ -->
  <g opacity="0.35" fill="#DDD6FE">
    <circle cx="58"  cy="42"  r="0.9"/>
    <circle cx="182" cy="28"  r="0.7"/>
    <circle cx="312" cy="19"  r="1.1"/>
    <circle cx="441" cy="55"  r="0.8"/>
    <circle cx="470" cy="138" r="1.0"/>
    <circle cx="488" cy="290" r="0.7"/>
    <circle cx="455" cy="412" r="0.9"/>
    <circle cx="390" cy="475" r="0.8"/>
    <circle cx="270" cy="490" r="1.0"/>
    <circle cx="128" cy="478" r="0.7"/>
    <circle cx="32"  cy="398" r="0.9"/>
    <circle cx="14"  cy="260" r="0.8"/>
    <circle cx="38"  cy="168" r="1.1"/>
    <circle cx="88"  cy="452" r="0.7"/>
    <circle cx="420" cy="198" r="0.8"/>
    <circle cx="92"  cy="310" r="1.0"/>
    <circle cx="368" cy="350" r="0.9"/>
    <circle cx="145" cy="390" r="0.7"/>
    <circle cx="342" cy="468" r="0.8"/>
    <circle cx="496" cy="82"  r="0.6"/>
  </g>

  <!-- ░░ CONSTELLATION STARS — named nodes ░░ -->
  <!-- These connect with faint lines below -->
  <!-- A=top    (250,108)  -->
  <!-- B=right  (378,192)  -->
  <!-- C=far-R  (418,275)  -->
  <!-- D=bot-R  (360,362)  -->
  <!-- E=bottom (250,392)  -->
  <!-- F=bot-L  (142,358)  -->
  <!-- G=far-L  (84,275)   -->
  <!-- H=left   (124,192)  -->

  <!-- Constellation lines — very faint -->
  <g stroke="#9333EA" stroke-width="0.75" opacity="0.28" fill="none">
    <line x1="250" y1="108" x2="378" y2="192"/>
    <line x1="378" y1="192" x2="418" y2="275"/>
    <line x1="418" y1="275" x2="360" y2="362"/>
    <line x1="360" y1="362" x2="250" y2="392"/>
    <line x1="250" y1="392" x2="142" y2="358"/>
    <line x1="142" y1="358" x2="84"  y2="275"/>
    <line x1="84"  y1="275" x2="124" y2="192"/>
    <line x1="124" y1="192" x2="250" y2="108"/>
    <!-- Cross spokes to center -->
    <line x1="250" y1="108" x2="250" y2="250"/>
    <line x1="418" y1="275" x2="250" y2="250"/>
    <line x1="84"  y1="275" x2="250" y2="250"/>
    <line x1="250" y1="392" x2="250" y2="250"/>
  </g>

  <!-- Constellation node dots — medium layer -->
  <g filter="url(#tinybloom)">
    <circle cx="250" cy="108" r="2.8" fill="#E9D5FF" opacity="0.90"/>
    <circle cx="378" cy="192" r="2.2" fill="#C084FC" opacity="0.80"/>
    <circle cx="418" cy="275" r="1.8" fill="#A855F7" opacity="0.65"/>
    <circle cx="360" cy="362" r="2.0" fill="#C084FC" opacity="0.72"/>
    <circle cx="250" cy="392" r="2.5" fill="#DDD6FE" opacity="0.85"/>
    <circle cx="142" cy="358" r="2.0" fill="#C084FC" opacity="0.72"/>
    <circle cx="84"  cy="275" r="1.8" fill="#A855F7" opacity="0.65"/>
    <circle cx="124" cy="192" r="2.2" fill="#C084FC" opacity="0.80"/>
  </g>

  <!-- ░░ ORBIT ARC — broken ring ░░ -->
  <!-- Arc sweeps ~280° leaving a gap at lower-left -->
  <path d="M250,95 A155,155 0 1,1 114,345"
        fill="none"
        stroke="#7C3AED"
        stroke-width="0.8"
        stroke-dasharray="4,7"
        opacity="0.38"/>

  <!-- ░░ MAIN STAR MARK — two diamonds overlaid ░░ -->
  <!-- Primary diamond: tall vertical -->
  <path d="M250,148 L272,244 L250,340 L228,244 Z"
        fill="url(#starGrad)"
        filter="url(#bloom)"
        opacity="0.95"/>
  <!-- Secondary diamond: wide horizontal -->
  <path d="M160,250 L244,228 L340,250 L244,272 Z"
        fill="url(#starGrad2)"
        filter="url(#bloom)"
        opacity="0.80"/>

  <!-- Pinched 4-point crisp overlay for sharp edges -->
  <path d="
    M250,152
    C252,196 264,238 290,250
    C264,262 252,304 250,348
    C248,304 236,262 210,250
    C236,238 248,196 250,152
    Z"
        fill="url(#starGrad)"
        opacity="0.88"/>
  <path d="
    M164,250
    C208,248 238,264 250,290
    C262,264 292,248 336,250
    C292,252 262,236 250,210
    C238,236 208,252 164,250
    Z"
        fill="url(#starGrad2)"
        opacity="0.72"/>

  <!-- Core radiance -->
  <circle cx="250" cy="250" r="88" fill="url(#coreGlow)" filter="url(#bloom)"/>

  <!-- Core hot dot -->
  <circle cx="250" cy="250" r="7.5" fill="#FAF5FF" filter="url(#softglow)"/>
  <circle cx="250" cy="250" r="3.2" fill="#FFFFFF"/>

  <!-- ░░ SMALL ACCENT SPARKLES ░░ -->
  <!-- Top sparkle -->
  <path d="M250,60 L252.4,68 L260,70.4 L252.4,72.8 L250,80.8 L247.6,72.8 L240,70.4 L247.6,68 Z"
        fill="#F0E6FF" filter="url(#tinybloom)" opacity="0.78"/>
  <!-- Right sparkle -->
  <path d="M440,250 L442,256 L448,258 L442,260 L440,266 L438,260 L432,258 L438,256 Z"
        fill="#D8B4FE" filter="url(#tinybloom)" opacity="0.62"/>
  <!-- Left micro -->
  <path d="M62,250 L63.4,254.4 L67.8,255.8 L63.4,257.2 L62,261.6 L60.6,257.2 L56.2,255.8 L60.6,254.4 Z"
        fill="#C084FC" filter="url(#tinybloom)" opacity="0.50"/>
  <!-- Bottom sparkle -->
  <path d="M250,432 L251.8,437.4 L257.2,439.2 L251.8,441 L250,446.4 L248.2,441 L242.8,439.2 L248.2,437.4 Z"
        fill="#E9D5FF" filter="url(#tinybloom)" opacity="0.60"/>
  <!-- Diagonal accents -->
  <path d="M388,138 L389.2,141.8 L393,143 L389.2,144.2 L388,148 L386.8,144.2 L383,143 L386.8,141.8 Z"
        fill="#DDD6FE" opacity="0.52"/>
  <path d="M114,360 L115,363.2 L118.2,364.2 L115,365.2 L114,368.4 L113,365.2 L109.8,364.2 L113,363.2 Z"
        fill="#A78BFA" opacity="0.44"/>

  <!-- ░░ WORDMARK ░░ -->
  <text
    x="250" y="474"
    text-anchor="middle"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="30"
    font-weight="200"
    letter-spacing="16"
    fill="url(#wordGrad)"
    filter="url(#wordglow)">ASTRALIS</text>

  <!-- Hairline rule above wordmark -->
  <line x1="128" y1="450" x2="372" y2="450"
        stroke="#7C3AED" stroke-width="0.6" opacity="0.40"/>
</svg>
